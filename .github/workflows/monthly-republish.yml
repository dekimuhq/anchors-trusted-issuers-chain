name: Monthly republish

# Keeps the head of the trusted-issuers chain inside its validity window.
# (File name kept for history; the check runs WEEKLY since 2026-10-19.)
#
# Every doc is valid for 30 days. The job re-signs when fewer than 14 days
# remain, so a weekly check gives two attempts and >= 7 days for the PR to
# merge before the head expires. The old schedule (1st of the month, skip if
# the head is < 30 days old) left a doc issued mid-month expired for up to a
# month, and the REPUBLISH_ENABLED gate was never provisioned at the B6
# ceremony, so v01 expired 2026-08-16 behind a green "dry-run" every month.
#
# Output is a PR (never a direct push to main): the founder merge is the
# publish gate. verify.dekimu.com serves chain/head.json from main, so the
# new doc is live within its cache window (1h) of the merge.
#
# Red (exit 2) when a renewal is due but cannot be produced — missing
# SIGNING_KEY_BASE64 or the REPUBLISH_DISABLED=1 kill switch (repo variable).

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: republish
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Self-tests (JCS + planner/signer + committed chain)
        run: |
          node scripts/test-canonical.mjs
          node scripts/test-republish.mjs

      - name: Skip if a republish PR is already open
        id: dupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OPEN=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("republish/"))] | length')
          echo "open=${OPEN}" >> "$GITHUB_OUTPUT"
          if [ "$OPEN" != "0" ]; then
            echo "::notice::a republish PR is already open — merge it; not opening another."
          fi

      - name: Re-sign head if due
        id: republish
        if: steps.dupe.outputs.open == '0'
        env:
          REPUBLISH_DISABLED: ${{ vars.REPUBLISH_DISABLED || '0' }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: node scripts/republish.mjs

      - name: Re-run self-tests over the new chain
        if: steps.republish.outputs.wrote != ''
        run: node scripts/test-republish.mjs

      - name: Open republish PR
        if: steps.republish.outputs.wrote != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.republish.outputs.wrote }}
          VERSION: ${{ steps.republish.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="republish/v${VERSION}"
          git config user.name "dekimu-bot"
          git config user.email "ops@dekimu.com"
          git checkout -b "$BRANCH"
          # pathspec add stages the new file, head.json and a deleted proposal file
          git add chain/
          TITLE="republish: v${VERSION} (${FILE})"
          BODY="Automated re-sign from the republish workflow (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). New head chained via previous_sha256 to the previous signed doc; signature self-verified and the full committed chain re-checked by scripts/test-republish.mjs before this PR opened. Merging publishes it: verify.dekimu.com/.well-known/dekimu-trusted-issuers.json serves chain/head.json from main."
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
